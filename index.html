<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Diem</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}
.header{background:#fff;padding:25px;border-radius:12px;margin-bottom:15px;box-shadow:0 4px 6px rgba(0,0,0,.1)}
.header h1{color:#333;font-size:28px;margin-bottom:3px}
.header p{color:#666;font-size:14px;margin-bottom:8px}
.weather{font-size:13px;color:#666}
.section{background:#fff;padding:25px;border-radius:12px;margin-bottom:15px;box-shadow:0 4px 6px rgba(0,0,0,.1)}
.section h2{color:#667eea;font-size:18px;margin-bottom:15px;border-bottom:2px solid #667eea;padding-bottom:10px}
.news-link{display:block;text-decoration:none;color:inherit;padding:12px;margin-bottom:12px;background:#f9f9f9;border-radius:6px;border-left:3px solid #667eea;transition:all 0.2s}
.news-link:hover{background:#f0f4ff;border-left-color:#764ba2}
.news-link h3{color:#333;font-size:15px;margin-bottom:5px}
.news-link p{color:#666;font-size:13px;line-height:1.5}
.tip{background:#f0f4ff;padding:20px;border-left:4px solid #667eea;border-radius:6px;margin-bottom:15px}
.action{background:#fff8f0;padding:15px;margin-bottom:10px;border-left:4px solid #ff9500;border-radius:6px}
.action h4{color:#ff9500;font-size:14px;margin-bottom:5px}
.upcoming{padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
.upcoming strong{color:#667eea}
.upcoming .days{font-size:12px;color:#999}
.task{display:flex;padding:10px;margin-bottom:8px;background:white;border-radius:6px;border-left:3px solid #ddd}
.task.completed{border-left-color:#2ecc71;opacity:0.7}
.task input{width:18px;height:18px;margin-right:12px;cursor:pointer}
.task label{flex:1;color:#333;font-size:14px;cursor:pointer}
.task.completed label{text-decoration:line-through;color:#999}
.progress-bar{width:100%;height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin-top:12px}
.progress-fill{height:100%;background:linear-gradient(90deg,#667eea 0%,#764ba2 100%);width:0%}
.progress-text{font-size:12px;color:#666;margin-top:6px;text-align:right}
#refresh-btn{margin-top:12px;padding:8px 16px;background:#667eea;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px}
#refresh-btn:hover{background:#764ba2}
#celeb-text{line-height:1.6;font-size:14px;color:#333}
#celeb-text strong{color:#667eea;display:block;margin-bottom:8px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>☕ Good Morning, Chris</h1>
<p id="date"></p>
<div class="weather" id="weather"></div>
<button id="refresh-btn">🔄 Refresh</button>
</div>

<div class="section">
<h2>⭐ News</h2>
<div id="news"></div>
</div>

<div class="section">
<h2>🌴 Miami & Florida</h2>
<div id="miami"></div>
</div>

<div class="section" id="celeb-sec" style="display:none">
<h2>🎉 Today</h2>
<div id="celeb-text"></div>
</div>

<div class="section">
<h2>📅 Coming Up</h2>
<div id="upcoming"></div>
</div>

<div class="section">
<h2>💡 Tip</h2>
<div class="tip">
<h3 id="tip-title"></h3>
<p id="tip-body"></p>
</div>
</div>

<div class="section">
<h2>✅ Today</h2>
<div id="actions"></div>
</div>

<div class="section">
<h2>📖 Read</h2>
<h3 id="art-title" style="color:#1abc9c;margin-bottom:10px"></h3>
<p id="art-why" style="margin-bottom:10px;font-size:13px;color:#666"></p>
<a id="art-link" target="_blank" style="display:inline-block;background:#1abc9c;color:#fff;padding:8px 16px;border-radius:6px;text-decoration:none;font-size:13px">Open</a>
</div>

<div class="section">
<h2>✅ Completed This Week</h2>
<p style="font-size:13px;color:#666;margin-bottom:15px">Guest Bedroom - Bed frame & mattress ordered!</p>
</div>

<div class="section">
<h2>🎨 Art & Rug for Home</h2>
<div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; border-radius: 8px 8px 0 0; font-weight: 600; margin-bottom: -20px;">Due by June 7</div>
<div style="background: #fafafa; padding: 20px; border-radius: 0 0 8px 8px; margin-top: 0;">
<div class="task"><input type="checkbox" id="t1"><label for="t1">1. Choose art for office</label></div>
<div class="task"><input type="checkbox" id="t2"><label for="t2">2. Choose art for entryway</label></div>
<div class="task"><input type="checkbox" id="t3"><label for="t3">3. Choose rug for entryway</label></div>
<div class="task"><input type="checkbox" id="t4"><label for="t4">4. Purchase all pieces</label></div>
<div class="task"><input type="checkbox" id="t5"><label for="t5">5. Install/hang everything</label></div>
<div class="progress-bar"><div class="progress-fill"></div></div>
<div class="progress-text">0 of 5 complete</div>
</div>
</div>
</div>

<script>
function render(d) {
  document.getElementById('date').textContent = d.dayOfWeek + ', ' + d.date;
  
  if (d.weather) {
    const w = d.weather;
    document.getElementById('weather').innerHTML = 
      '<strong>Miami:</strong> ' + w.temp_range + 'F, ' + w.condition + '<br>' +
      'Wind: ' + w.wind + ' | Rain: ' + w.chance_rain + ' | Humidity: ' + w.humidity;
  }
  
  document.getElementById('news').innerHTML = (d.usNews || [])
    .map(n => '<a href="' + n.url + '" target="_blank" class="news-link"><h3>' + n.title + '</h3><p>' + n.description + '</p></a>')
    .join('');
  
  document.getElementById('miami').innerHTML = (d.miamiNews || [])
    .map(n => '<a href="' + n.url + '" target="_blank" class="news-link"><h3>' + n.title + '</h3><p>' + n.description + '</p></a>')
    .join('') || '<p style="color:#999">No Miami news today</p>';
  
  if (d.celebration) {
    document.getElementById('celeb-sec').style.display = 'block';
    let celebText = '';
    if (d.celebration.holiday) {
      celebText += '<strong>' + d.celebration.holiday + '</strong>';
    }
    if (d.celebration.event) {
      celebText += d.celebration.event;
    }
    document.getElementById('celeb-text').innerHTML = celebText;
  }
  
  document.getElementById('upcoming').innerHTML = (d.upcoming || [])
    .map(u => '<div class="upcoming"><strong>' + u.event + '</strong><div class="days">' + u.daysUntil + ' days away</div></div>')
    .join('');
  
  if (d.tip) {
    document.getElementById('tip-title').textContent = d.tip.title;
    document.getElementById('tip-body').textContent = d.tip.content;
  }
  
  document.getElementById('actions').innerHTML = (d.actions || [])
    .map((a, i) => '<div class="action"><h4>' + (i+1) + '. ' + a.action + '</h4><p><strong>' + a.time + '</strong> • ' + a.description + '</p></div>')
    .join('');
  
  if (d.article) {
    document.getElementById('art-title').textContent = '"' + d.article.title + '" — ' + d.article.source;
    document.getElementById('art-why').textContent = d.article.reason;
    document.getElementById('art-link').href = d.article.url;
  }
}

function load() {
  const base = window.location.pathname.split('/').filter(x => x).pop() || '';
  const path = base ? '/' + base + '/data.json' : '/data.json';
  const url = window.location.origin + path + '?t=' + Date.now();
  
  fetch(url, { cache: 'no-store' })
    .then(r => r.json())
    .then(d => render(d))
    .catch(e => {
      console.error('Error:', e);
      document.getElementById('news').textContent = 'Error: ' + e.message;
    });
}

setTimeout(() => {
  ['t1','t2','t3','t4','t5'].forEach((id, i) => {
    const cb = document.getElementById(id);
    if (localStorage.getItem(id)) cb.checked = true;
    if (cb.checked) cb.parentElement.classList.add('completed');
    cb.addEventListener('change', () => {
      localStorage.setItem(id, cb.checked);
      cb.parentElement.classList.toggle('completed');
      updateProgress();
    });
  });
  updateProgress();
}, 100);

function updateProgress() {
  const total = 5;
  const checked = ['t1','t2','t3','t4','t5'].filter(id => document.getElementById(id)?.checked).length;
  const pct = Math.round(checked / total * 100);
  document.querySelector('.progress-fill').style.width = pct + '%';
  document.querySelector('.progress-text').textContent = checked + ' of ' + total + ' complete';
}

document.getElementById('refresh-btn').addEventListener('click', load);
load();
</script>
</body>
</html>
