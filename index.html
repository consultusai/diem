<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Diem</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}
.header{background:#fff;padding:30px;border-radius:12px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,.1)}
.header h1{color:#333;font-size:28px;margin-bottom:5px}
.header p{color:#666;font-size:14px}
.section{background:#fff;padding:25px;border-radius:12px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,.1)}
.section h2{color:#667eea;font-size:18px;margin-bottom:15px;border-bottom:2px solid #667eea;padding-bottom:10px}
.item{margin-bottom:15px;padding-bottom:15px;border-bottom:1px solid #eee}
.item:last-child{border-bottom:none;margin-bottom:0}
.item h3{color:#333;font-size:15px;margin-bottom:5px}
.item p{color:#666;font-size:13px;line-height:1.5}
.tip{background:#f0f4ff;padding:20px;border-left:4px solid #667eea;border-radius:6px;margin-bottom:15px}
.action{background:#fff8f0;padding:15px;margin-bottom:10px;border-left:4px solid #ff9500;border-radius:6px}
.action h4{color:#ff9500;font-size:14px;margin-bottom:5px}
.upcoming{padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
.upcoming strong{color:#667eea}
#refresh-btn{margin-top:15px;padding:8px 16px;background:#667eea;color:#fff;border:none;border-radius:6px;cursor:pointer}
#weather{margin:15px 0;padding:15px 0;border-top:1px solid #eee;font-size:13px;color:#666}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>☕ Good Morning, Chris</h1>
<p id="date"></p>
<div id="weather"></div>
<button id="refresh-btn">🔄 Refresh</button>
</div>

<div class="section">
<h2>⭐ News</h2>
<div id="news"></div>
</div>

<div class="section">
<h2>🌴 Miami & Florida</h2>
<div id="miami"></div>
</div>

<div class="section" id="celeb-sec" style="display:none">
<h2>🎉 Today</h2>
<p id="celeb"></p>
</div>

<div class="section">
<h2>📅 Coming Up</h2>
<div id="upcoming"></div>
</div>

<div class="section">
<h2>💡 Tip</h2>
<div class="tip">
<h3 id="tip-title"></h3>
<p id="tip-body"></p>
</div>
</div>

<div class="section">
<h2>✅ Today</h2>
<div id="actions"></div>
</div>

<div class="section">
<h2>📖 Read</h2>
<h3 id="art-title" style="color:#1abc9c;margin-bottom:10px"></h3>
<p id="art-why" style="margin-bottom:10px;font-size:13px;color:#666"></p>
<a id="art-link" target="_blank" style="display:inline-block;background:#1abc9c;color:#fff;padding:8px 16px;border-radius:6px;text-decoration:none;font-size:13px">Open</a>
</div>
</div>

<script>
function render(d) {
  document.getElementById('date').textContent = d.dayOfWeek + ', ' + d.date;
  
  if (d.weather) {
    const w = d.weather;
    document.getElementById('weather').innerHTML = 
      '<strong>Miami:</strong> ' + w.temp_range + 'F, ' + w.condition + '<br>' +
      'Wind: ' + w.wind + ' | Rain: ' + w.chance_rain + ' | Humidity: ' + w.humidity;
  }
  
  document.getElementById('news').innerHTML = (d.usNews || [])
    .map(n => '<div class="item"><h3>' + n.title + '</h3><p>' + n.description + '</p></div>')
    .join('');
  
  document.getElementById('miami').innerHTML = (d.miamiNews || [])
    .map(n => '<div class="item"><h3>' + n.title + '</h3><p>' + n.description + '</p></div>')
    .join('');
  
  if (d.celebration) {
    document.getElementById('celeb-sec').style.display = 'block';
    document.getElementById('celeb').textContent = 'Today is ' + d.celebration + '!';
  }
  
  document.getElementById('upcoming').innerHTML = (d.upcoming || [])
    .map(u => '<div class="upcoming"><strong>' + u.event + '</strong><br>' + u.daysUntil + ' days away</div>')
    .join('');
  
  if (d.tip) {
    document.getElementById('tip-title').textContent = d.tip.title;
    document.getElementById('tip-body').textContent = d.tip.content;
  }
  
  document.getElementById('actions').innerHTML = (d.actions || [])
    .map((a, i) => '<div class="action"><h4>' + (i+1) + '. ' + a.action + '</h4><p><strong>' + a.time + '</strong> • ' + a.description + '</p></div>')
    .join('');
  
  if (d.article) {
    document.getElementById('art-title').textContent = '"' + d.article.title + '" — ' + d.article.source;
    document.getElementById('art-why').textContent = d.article.reason;
    document.getElementById('art-link').href = d.article.url;
  }
}

function load() {
  const base = window.location.pathname.split('/').filter(x => x).pop() || '';
  const path = base ? '/' + base + '/data.json' : '/data.json';
  const url = window.location.origin + path + '?t=' + Date.now();
  
  console.log('Loading from:', url);
  fetch(url, { cache: 'no-store' })
    .then(r => r.json())
    .then(d => {
      console.log('Got data, rendering...');
      render(d);
    })
    .catch(e => {
      console.error('Error:', e);
      document.getElementById('news').textContent = 'Error: ' + e.message;
    });
}

document.getElementById('refresh-btn').addEventListener('click', load);
load();
</script>
</body>
</html>
