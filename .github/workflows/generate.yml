name: Generate Dashboard

on:
  schedule:
    # 7:30 AM ET (11:30 AM UTC during daylight saving)
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Generate dashboard
      run: node generate-dashboard.js
    
    - name: Commit changes
      run: |
        git config user.name "Diem Bot"
        git config user.email "diem@consultusai.com"
        git add data.json
        git commit -m "Update dashboard - $(date)" || true
        git push
